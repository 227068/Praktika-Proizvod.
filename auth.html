<!-- frontend/auth.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>
        
        <div id="login-form" class="form active">
            <h2>Вход</h2>
            <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Пароль:</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="login-btn">Войти</button>
            <div id="login-error" class="error"></div>
        </div>
        
        <div id="register-form" class="form">
            <h2>Регистрация</h2>
            <div class="form-group">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" required>
            </div>
            <div class="form-group">
                <label for="register-password">Пароль (мин. 6 символов):</label>
                <input type="password" id="register-password" required>
            </div>
            <div class="form-group">
                <label for="register-confirm">Подтвердите пароль:</label>
                <input type="password" id="register-confirm" required>
            </div>
            <button id="register-btn">Зарегистрироваться</button>
            <div id="register-error" class="error"></div>
        </div>
    </div>
    
    <script src="/js/auth.js"></script>
</body>
</html>
